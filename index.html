<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index, follow" />
  <meta name="description" content="Legal documents for the Feed Me mobile app." />
  <title>Feed Me — Legal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --parchment: #FCFCFB;
      --cream: #F4F4F2;
      --elevated: #ECECE9;
      --ink: #1F2320;
      --ink-soft: #4A4F4C;
      --muted: #898E8B;
      --terracotta: #B06A4F;
      --terracotta-glow: rgba(176, 106, 79, 0.12);
      --border: #E6E6E2;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--parchment);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 520px;
      padding: 48px 24px;
      text-align: center;
    }

    h1 {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 40px;
      line-height: 1.1;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    p.tagline {
      color: var(--muted);
      margin: 0 0 40px;
      font-size: 15px;
    }

    .card-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }

    a.card {
      display: block;
      padding: 20px 24px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    a.card:hover {
      transform: translateY(-1px);
      border-color: var(--terracotta);
      background: var(--terracotta-glow);
    }

    a.card .label { font-size: 18px; display: block; }

    a.card .desc {
      display: block;
      margin-top: 4px;
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-soft);
    }

    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 13px;
    }

    footer a { color: var(--terracotta); text-decoration: none; }

    @media (prefers-color-scheme: dark) {
      :root {
        --parchment: #1C1E1D;
        --cream: #262928;
        --elevated: #303432;
        --ink: #ECECEA;
        --ink-soft: #C4C7C4;
        --muted: #8B908D;
        --terracotta: #CC8E72;
        --terracotta-glow: rgba(204, 142, 114, 0.16);
        --border: #343836;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Feed Me</h1>
    <p class="tagline">Help &amp; policy documents</p>

    <div class="card-grid">
      <a class="card" href="./how-to-use.html">
        <span class="label">How to use Feed Me</span>
        <span class="desc">A friendly guide to getting started</span>
      </a>
      <a class="card" href="./privacy.html">
        <span class="label">Privacy Policy</span>
        <span class="desc">What we collect and how we handle your data</span>
      </a>
      <a class="card" href="./terms.html">
        <span class="label">Terms of Service</span>
        <span class="desc">The rules for using the app</span>
      </a>
      <a class="card" href="./delete-account.html">
        <span class="label">Delete your account</span>
        <span class="desc">How to remove your account and data</span>
      </a>
    </div>

    <footer>
      Questions? <a href="mailto:support@envyapplications.com">support@envyapplications.com</a>
    </footer>
  </main>
</body>
</html>
