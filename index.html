<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index, follow" />
  <meta name="description" content="Legal documents for the Feed Me mobile app." />
  <title>Feed Me — Legal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --parchment: #F5EDD9;
      --cream: #FBF5E4;
      --elevated: #F4E2C0;
      --ink: #1F1A14;
      --ink-soft: #5A4A3D;
      --muted: #8A7E6E;
      --terracotta: #C4785A;
      --terracotta-glow: rgba(196, 120, 90, 0.22);
      --border: #E2D2B8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--parchment);
      color: var(--ink);
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 520px;
      padding: 48px 24px;
      text-align: center;
    }

    h1 {
      font-family: "Lora", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: 44px;
      line-height: 1.1;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    h1::after { content: "."; color: var(--terracotta); }

    p.tagline {
      color: var(--muted);
      margin: 0 0 40px;
      font-size: 15px;
    }

    .card-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }

    a.card {
      display: block;
      padding: 20px 24px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    a.card:hover {
      transform: translateY(-1px);
      border-color: var(--terracotta);
      background: var(--terracotta-glow);
    }

    a.card .label { font-size: 18px; display: block; }

    a.card .desc {
      display: block;
      margin-top: 4px;
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-soft);
    }

    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 13px;
    }

    footer a { color: var(--terracotta); text-decoration: none; }

    @media (prefers-color-scheme: dark) {
      :root {
        --parchment: #1A1410;
        --cream: #241B16;
        --elevated: #2E2520;
        --ink: #F5EDD9;
        --ink-soft: #D8C9B0;
        --muted: #8A7E6E;
        --terracotta: #D88662;
        --terracotta-glow: rgba(216, 134, 98, 0.35);
        --border: #3A302A;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Feed Me</h1>
    <p class="tagline">Help &amp; policy documents</p>

    <div class="card-grid">
      <a class="card" href="./how-to-use.html">
        <span class="label">How to use Feed Me</span>
        <span class="desc">A friendly guide to getting started</span>
      </a>
      <a class="card" href="./privacy.html">
        <span class="label">Privacy Policy</span>
        <span class="desc">What we collect and how we handle your data</span>
      </a>
      <a class="card" href="./terms.html">
        <span class="label">Terms of Service</span>
        <span class="desc">The rules for using the app</span>
      </a>
    </div>

    <footer>
      Questions? <a href="mailto:support@envyapplications.com">support@envyapplications.com</a>
    </footer>
  </main>
</body>
</html>
